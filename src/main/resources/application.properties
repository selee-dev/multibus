# 로컬에서는 8080을 사용하고, Render에서는 PORT 환경변수를 사용합니다.
server.port=${PORT:8080}
server.address=0.0.0.0

# ---- 로컬 기본 H2 / 배포용 PostgreSQL 환경변수 override ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/herodb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ---- MyBatis ----
mybatis.mapper-locations=classpath:mapper/*.xml

# 계정과 캐릭터도 같은 파일 DB에 저장되며, 스키마 생성은 기존 행을 삭제하지 않습니다.
